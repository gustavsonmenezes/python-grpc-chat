syntax = "proto3";

package chat;

service SimpleChat {
  rpc SendMessage (ChatMessage) returns (ChatResponse);
  rpc ReceiveMessages (Empty) returns (stream ChatMessage);
}

message ChatMessage {
  string user = 1;
  string text = 2;
}

message ChatResponse {
  bool success = 1;
  string status = 2;
}

message Empty {}